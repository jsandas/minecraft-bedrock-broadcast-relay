services:
  server:
    image: ghcr.io/jsandas/nethernet_relay:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NN_REMOTE_ADDR: "10.4.10.130:7551"
      NN_LISTEN_ADDR: "0.0.0.0:7551"
      NN_PUBLIC_IP: "10.4.10.130"
    ports:
      - '7551:7551/udp'
    network_mode: "bridge"
