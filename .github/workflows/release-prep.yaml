name: Release Prep

on:
  push:
    branches:
      - "release/v*.*.*"

permissions:
  contents: write

jobs:
  release-prep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update Helm versions
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          CHART_PATH: helm/minecraft-bedrock-broadcast-relay/Chart.yaml
        run: |
          set -euo pipefail

          release_version="${BRANCH_NAME#release/v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release branch version: ${release_version}"
            exit 1
          fi

          chart_version="$(grep '^version:' "${CHART_PATH}" | awk '{print $2}')"
          if [[ -z "${chart_version}" ]]; then
            echo "Could not read chart version from ${CHART_PATH}"
            exit 1
          fi

          if [[ ! "${chart_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Chart version is not semver (x.y.z): ${chart_version}"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next_patch=$((patch + 1))
          next_chart_version="${major}.${minor}.${next_patch}"

          sed -i "s/^version:.*/version: ${next_chart_version}/" "${CHART_PATH}"
          sed -i "s/^appVersion:.*/appVersion: \"${release_version}\"/" "${CHART_PATH}"

          echo "Updated chart version to ${next_chart_version}"
          echo "Updated appVersion to ${release_version}"

      - name: Commit changes
        run: |
          set -euo pipefail

          if git diff --quiet -- helm/minecraft-bedrock-broadcast-relay/Chart.yaml; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/minecraft-bedrock-broadcast-relay/Chart.yaml
          git commit -m "chore(release): prepare ${GITHUB_REF_NAME}"
          git push
